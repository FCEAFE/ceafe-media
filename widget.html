<style>
  #ceafe-mw {
    --silver: #999999;
    --eu-blue: #003399;
    --ink: #1c1c1c;
    --muted: #5a5a5a;
    --slate: #6D7B8D;
    --slate-dark: #5a6a7a;
    --rule: #d0d0d0;
    --paper: #ffffff;
    --wash: #f8f9fa;
    --line: #e0e0e0;
    --focus: #003399;
    --radius: 12px;
    --font-head: Montserrat, Cabin, "Source Sans Pro", Karla, Arial, Helvetica, sans-serif;
    --font-body: "Source Sans Pro", Montserrat, Cabin, Karla, Arial, Helvetica, sans-serif;
    box-sizing: border-box;
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 12px 28px;
    color: var(--ink);
    background: var(--paper);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    text-align: left;
  }
  #ceafe-mw *, #ceafe-mw *::before, #ceafe-mw *::after { box-sizing: border-box; }
  #ceafe-mw a { color: var(--eu-blue); text-decoration: none; }
  #ceafe-mw a:hover { text-decoration: underline; }
  #ceafe-mw button {
    font-family: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  #ceafe-mw button:focus-visible,
  #ceafe-mw a:focus-visible,
  #ceafe-mw [tabindex]:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  #ceafe-mw img { max-width: 100%; height: auto; display: block; }
  #ceafe-mw h2, #ceafe-mw h3 {
    font-family: var(--font-head) !important;
    color: var(--ink) !important;
    font-weight: 700 !important;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: none;
  }

  #ceafe-mw .cmw-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 4px 0 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--silver);
  }
  #ceafe-mw .cmw-brand {
    display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none;
  }
  #ceafe-mw .cmw-brand img { width: 32px; height: 32px; object-fit: contain; }
  #ceafe-mw .cmw-brand span {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--silver);
  }

  #ceafe-mw .cmw-lang {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    overflow: hidden;
    background: var(--wash);
  }
  #ceafe-mw .cmw-lang button {
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  #ceafe-mw .cmw-lang button[aria-pressed="true"] {
    background: var(--eu-blue);
    color: #fff;
  }

  #ceafe-mw .cmw-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    gap: 28px;
    align-items: start;
  }
  #ceafe-mw .cmw-kicker {
    font-family: var(--font-head) !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate) !important;
    margin: 0;
  }
  #ceafe-mw .cmw-sections-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 22px 0 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--silver);
  }
  #ceafe-mw .cmw-edition-label {
    color: var(--eu-blue);
    white-space: nowrap;
  }
  #ceafe-mw .cmw-audio {
    display: flex; align-items: center; gap: 8px;
    margin: -4px 0 12px;
  }
  #ceafe-mw .cmw-audio[hidden] { display: none !important; }
  #ceafe-mw .cmw-audio-label {
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 13px;
    color: var(--eu-blue);
    white-space: nowrap;
  }
  #ceafe-mw .cmw-audio audio {
    height: 32px; flex: 1 1 220px; min-width: 160px; max-width: 380px;
  }
  #ceafe-mw .cmw-card .cmw-card-time {
    display: block;
    margin: -4px 0 6px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  #ceafe-mw .cmw-sections-date {
    font-family: var(--font-head);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  #ceafe-mw .cmw-pane {
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  #ceafe-mw .cmw-pane-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  #ceafe-mw .cmw-nav { display: flex; align-items: center; gap: 4px; }
  #ceafe-mw .cmw-arrow {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--slate);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #ceafe-mw .cmw-arrow:hover { background: var(--slate-dark); }
  #ceafe-mw .cmw-arrow:disabled {
    background: #c5c9ce;
    color: #f3f3f3;
    cursor: default;
  }
  #ceafe-mw .cmw-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #111;
    border-radius: 6px;
    overflow: hidden;
  }
  #ceafe-mw .cmw-stage iframe,
  #ceafe-mw .cmw-stage video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #000;
  }
  #ceafe-mw .cmw-thumb {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #ceafe-mw .cmw-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.28);
    color: #fff;
  }
  #ceafe-mw .cmw-play span {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(0, 51, 153, 0.92);
    border: 2px solid #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    padding-left: 4px;
  }
  #ceafe-mw .cmw-play:hover span { background: #003399; }
  #ceafe-mw .cmw-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    color: #eee;
    font-size: 14px;
    background: #2a2a2a;
  }
  #ceafe-mw .cmw-date {
    margin: 10px 0 0;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    min-height: 1.4em;
  }
  #ceafe-mw .cmw-vtitle {
    margin: 2px 0 0;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    min-height: 1.3em;
  }
  #ceafe-mw .cmw-error { color: #8a1f1f; }

  #ceafe-mw .cmw-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  #ceafe-mw .cmw-card {
    background: var(--wash);
    border: 1px solid var(--line);
    border-top: 3px solid var(--eu-blue);
    border-radius: var(--radius);
    padding: 14px 14px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #ceafe-mw .cmw-card h3 {
    font-family: var(--font-head) !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    color: var(--silver) !important;
    margin: 0 0 10px !important;
  }
  #ceafe-mw .cmw-card ol {
    margin: 0 0 12px;
    padding-left: 1.15em;
    flex: 1 1 auto;
  }
  #ceafe-mw .cmw-card li {
    margin: 0 0 6px;
    font-size: 14px;
    line-height: 1.35;
    color: var(--ink);
  }
  #ceafe-mw .cmw-card li:last-child { margin-bottom: 0; }
  #ceafe-mw .cmw-card li a.cmw-story {
    color: inherit !important;
    text-decoration: none;
    cursor: pointer;
  }
  #ceafe-mw .cmw-card li a.cmw-story:hover { text-decoration: underline; }
  #ceafe-mw .cmw-btn {
    display: inline-block;
    margin-top: auto;
    padding: 8px 14px;
    background: var(--eu-blue);
    color: #fff !important;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    text-decoration: none !important;
    align-self: flex-start;
  }
  #ceafe-mw .cmw-btn:hover { background: #002266; }
  #ceafe-mw .cmw-muted { color: var(--muted); font-size: 14px; margin: 0 0 8px; }

  #ceafe-mw .cmw-side {
    position: sticky;
    top: 8px;
  }
  #ceafe-mw .cmw-side-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 0 0 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--silver);
  }
  #ceafe-mw .cmw-xwall {
    height: min(920px, calc(100vh - 110px));
    overflow-y: auto;
    overflow-x: hidden;
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    padding: 8px 10px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  #ceafe-mw .cmw-xcard {
    display: block;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 12px 10px;
    margin: 0 0 10px;
    color: inherit;
    text-decoration: none;
  }
  #ceafe-mw .cmw-xcard:hover { border-color: var(--silver); text-decoration: none; }
  #ceafe-mw .cmw-xmeta {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 6px;
  }
  #ceafe-mw .cmw-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    background: #eee;
    flex-shrink: 0;
  }
  #ceafe-mw .cmw-avatar-ph {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #6D7B8D;
    color: #fff;
    font-family: var(--font-head);
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
  }
  #ceafe-mw .cmw-xname { font-weight: 700; font-size: 14px; color: var(--ink); line-height: 1.2; }
  #ceafe-mw .cmw-xhandle, #ceafe-mw .cmw-xtime { color: var(--muted); font-size: 13px; font-weight: 400; }
  #ceafe-mw .cmw-xaction { font-size: 12px; color: var(--slate); margin: 0 0 8px 50px; }
  #ceafe-mw .cmw-xtext {
    font-size: 15px;
    color: var(--ink);
    white-space: pre-wrap;
    word-wrap: break-word;
    margin: 0 0 8px;
  }
  #ceafe-mw .cmw-xtext a { color: var(--eu-blue); }
  #ceafe-mw .cmw-ximage {
    width: 100%;
    max-height: 280px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--line);
    margin: 4px 0 6px;
  }
  #ceafe-mw .cmw-quote {
    margin: 8px 0 0;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fafafa;
  }
  #ceafe-mw .cmw-xmore { margin: 10px 0 0; font-size: 13px; }
  #ceafe-mw .cmw-xnote { margin: 0 0 2px; font-size: 12px; color: var(--muted); }
  #ceafe-mw .cmw-xfollow {
    display: inline-block;
    padding: 5px 12px;
    background: var(--eu-blue);
    color: #fff !important;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.02em;
    text-decoration: none !important;
    white-space: nowrap;
  }
  #ceafe-mw .cmw-xfollow:hover { background: #002266; text-decoration: none !important; }
  #ceafe-mw .cmw-notes-link {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  #ceafe-mw .cmw-xempty { padding: 16px 8px; }

  #ceafe-mw .cmw-sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  /* Wall column matches the height of the video + notes column (owner, 16 Nov 2026) */
  @media (min-width: 900px) {
    #ceafe-mw .cmw-layout { align-items: stretch; }
    #ceafe-mw .cmw-side { position: relative; top: auto; display: flex; flex-direction: column; min-height: 0; }
    #ceafe-mw .cmw-side [data-xwall] { flex: 1 1 auto; position: relative; min-height: 420px; }
    #ceafe-mw .cmw-side [data-xwall] > .cmw-xwall { position: absolute; inset: 0; height: auto; }
    #ceafe-mw .cmw-xmore { margin-bottom: 0; }
  }
  @media (max-width: 899px) {
    #ceafe-mw .cmw-layout { grid-template-columns: minmax(0, 1fr); }
    #ceafe-mw .cmw-side { position: static; }
    #ceafe-mw .cmw-xwall { height: min(700px, 80vh); }
  }
  @media (max-width: 640px) {
    #ceafe-mw .cmw-cards { grid-template-columns: minmax(0, 1fr); }
  }
  #ceafe-mw { min-width: 0; }
  #ceafe-mw .cmw-main, #ceafe-mw .cmw-side, #ceafe-mw .cmw-pane, #ceafe-mw .cmw-card { min-width: 0; max-width: 100%; }
  @media (prefers-reduced-motion: reduce) {
    #ceafe-mw * { transition: none !important; }
  }
</style>

<div id="ceafe-mw" data-lang="es">

      <p class="cmw-xmore"><a href="https://x.com/F_CEAFE" target="_blank" rel="noopener noreferrer" data-i18n="xMore">Publicaciones anteriores en X</a></p>
    </aside>
  </div>
</div>

  function sectionStore() {
    return (state.manifest && (state.manifest.sections || state.manifest.briefs)) || {};

  function sectionMeta() {
    if (state.manifest && Array.isArray(state.manifest.section_list) && state.manifest.section_list.length) {

      return state.manifest.lists;

      return { id: id, slug: id, short_en: id, short_es: id, title_en: id, title_es: id };
    });
  }

  function allDates() {
    var seen = {};
    var dates = [];
    function add(d) {
      if (d && !seen[d]) { seen[d] = true; dates.push(d); }
    }
    ((state.manifest && state.manifest.videos) || []).forEach(function (item) { add(item && item.date); });
    var store = sectionStore();
    Object.keys(store).forEach(function (slug) {
      ["en", "es"].forEach(function (lang) {
        (((store[slug] || {})[lang] || {}).items || []).forEach(function (item) { add(item && item.date); });
      });
    });
    dates.sort();
    dates.reverse();
    return dates.slice(0, 7);
  }

  function currentDate() {
    var dates = state.dates || [];
    var idx = state.dayIndex || 0;
    if (!dates.length) return "";
    if (idx < 0) idx = 0;
    if (idx > dates.length - 1) idx = dates.length - 1;
    state.dayIndex = idx;
    return dates[idx];

  /* Videos go public at their edition time (manifest publish_at, or
     item.time / item.edition on item.date, or 21:00 for a legacy day-level

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  function madridCivil(ymd, hour, minute) {
    var want = pad2(hour) + ":" + pad2(minute);
    var offsets = ["+01:00", "+02:00"];
    for (var i = 0; i < offsets.length; i++) {
      var d = new Date(ymd + "T" + want + ":00" + offsets[i]);
      if (isNaN(d.getTime())) continue;
      var parts = {};
      new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/Madrid",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hourCycle: "h23"

      if (parts.year + "-" + parts.month + "-" + parts.day === ymd &&
          parts.hour + ":" + parts.minute === want) return d;
    }
    return new Date(ymd + "T" + want + ":00+01:00");

  function videoPublishAt(item) {
    if (!item) return null;
    if (item.publish_at) {
      var d = new Date(item.publish_at);
      if (!isNaN(d.getTime())) return d;
    }
    if (item.date) {
      var hh = 21, mm = 0, got = false;
      if (item.edition && String(item.edition).length === 4) {
        hh = parseInt(String(item.edition).slice(0, 2), 10);
        mm = parseInt(String(item.edition).slice(2), 10);
        got = !isNaN(hh) && !isNaN(mm);
      }
      if (!got && item.time && String(item.time).indexOf(":") >= 0) {
        var parts = String(item.time).split(":");
        hh = parseInt(parts[0], 10);
        mm = parseInt(parts[1], 10);
        got = !isNaN(hh) && !isNaN(mm);
      }
      if (!got) { hh = 21; mm = 0; }

  function videoEditionKey(item) {

  function videoForDate(date, lang) {
    if (!date) return null;

    var now = new Date();
    var best = null;
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      if (item && item.date === date && isVideoReleased(item, now) && item[lang] && (isYoutubeId(item[lang].youtube_id) || item[lang].mp4)) {

  /* Items are sorted newest edition first. Without `edition`, the first match is the

  function sectionItem(slug, lang, date, edition) {

    for (var i = 0; i < items.length; i++) {
      if (!items[i] || items[i].date !== date) continue;
      if (edition === undefined || (items[i].edition || "") === edition) return items[i];
    }
    return null;
  }

  /* Latest published edition of a day across all sections: {edition, time, audio} or null. */

    for (var i = 0; i < list.length; i++) {

        break;
      }
    }
    if (best) return best;
    var store = sectionStore();
    Object.keys(store).forEach(function (slug) {
      ["en", "es"].forEach(function (lang) {
        (((store[slug] || {})[lang] || {}).items || []).forEach(function (item) {
          if (!item || item.date !== date) return;
          var ed = item.edition || "";
          if (!best || ed > best.edition) best = { edition: ed, time: item.time || "", audio: item.audio || null };
        });
      });
    });
    return best;
  }

  function editionAudioUrl(editionObj, lang) {
    var audio = editionObj && editionObj.audio;
    if (!audio) return "";
    return audio[lang] || audio.en || audio.es || "";
  }

  function renderEditionAudio(latest, lang) {
    var box = $("[data-saudio]");
    if (!box) return;
    var url = editionAudioUrl(latest, lang);
    if (!url) {
      box.setAttribute("hidden", "hidden");
      box.innerHTML = "";
      return;
    }
    box.removeAttribute("hidden");
    box.innerHTML = '<span class="cmw-audio-label">' + esc(t("listen")) + "</span>" +
      '<audio controls preload="none" src="' + esc(url) + '"></audio>';
  }

  function editionLabel(date, time, lang) {
    if (!date) return "";

  function hasVideoBlock(item, lang) {

  /* The home video never goes blank and never jumps to a day without an upload:
     the selected day's newest already-public video (publish_at passed),
     otherwise the newest already-public video overall (e.g. the 14:30 edition
     until 20:30 goes public). Page language first. */
  function videoToShow(date, lang) {
    var now = new Date();
    var list = ((state.manifest && state.manifest.videos) || []).filter(function (v) {
      return v && v.date && isVideoReleased(v, now);
    });
    list.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      var ea = videoEditionKey(a), eb = videoEditionKey(b);

    var langs = [lang, other];
    for (var li = 0; li < langs.length; li++) {

    for (var lj = 0; lj < langs.length; lj++) {
      for (var j = 0; j < list.length; j++) {

  function scheduleVideoReleaseRefresh() {
    if (state._publishTimer) {

  /* YouTube is shown as a real embed (no custom poster). One click is YouTube's

    iframe.src = src;
    iframe.title = title || "";
    iframe.allow = YT_ALLOW;
    iframe.setAttribute("allowfullscreen", "allowfullscreen");
    iframe.setAttribute("loading", "lazy");
    stage.innerHTML = "";
    stage.appendChild(iframe);
  }

  function renderYoutubeEmbed(stage, block, lang) {
    var src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(block.youtube_id) + "?rel=0&cc_load_policy=0";
    var title = block.title || (lang === "es" ? "Vídeo en español" : "English video");

  function renderMp4Poster(stage, block, lang) {
    stage.innerHTML = "";
    if (block.thumbnail) {
      var img = document.createElement("img");
      img.className = "cmw-thumb";
      img.src = block.thumbnail;
      img.alt = block.title || formatDay((state.dates || [])[state.dayIndex], lang);

    btn.type = "button";

      stage.innerHTML = "";
      stage.appendChild(video);
    });
    stage.appendChild(btn);
  }

  function renderVideo() {
    var lang = state.uiLang;
    var date = currentDate();
    var stage = $("[data-vstage]");
    var dateEl = $("[data-vdate]");
    var titleEl = $("[data-vtitle]");
    var pick = videoToShow(date, lang);
    if (!pick && (lang === "en" ? CONFIG.FALLBACK_PLAYLIST_EN : CONFIG.FALLBACK_PLAYLIST_ES)) {
      /* No video in the manifest at all: show the YouTube playlist rather than a blank box. */
      var pl = lang === "en" ? CONFIG.FALLBACK_PLAYLIST_EN : CONFIG.FALLBACK_PLAYLIST_ES;
      dateEl.textContent = "";
      titleEl.textContent = "";
      mountYoutubeIframe(stage, "https://www.youtube-nocookie.com/embed/videoseries?list=" + encodeURIComponent(pl) + "&cc_load_policy=0",

    if (!pick) {
      dateEl.textContent = date ? formatDay(date, lang) : "—";
      titleEl.textContent = "";

  function storyPdfHref(item, art, index) {
    if (art && art.pdf) return art.pdf;

    var id = (art && art.id) || ("s" + (index + 1));
    var page = art && art.page;
    var parts = [];
    if (page) parts.push("page=" + page);
    if (id) parts.push("nameddest=" + id);

  }

  function renderCards() {
    var box = $("[data-cards]");

    var edLabel = $("[data-sedition]");
    if (edLabel) {

    box.innerHTML = metas.map(function (meta) {
      var slug = meta.id || meta.slug;
      var title = lang === "en" ? (meta.title_en || meta.short_en || slug) : (meta.title_es || meta.short_es || slug);
      var wantEd = latest ? latest.edition : undefined;
      var item = sectionItem(slug, lang, date, wantEd) || sectionItem(slug, lang, date);
      var usedLang = lang;

  function renderFallbackVideo() {

  /* ---------- X wall ---------- */

  function linkify(text) {

    });

    });
    escaped = escaped.replace(/(^|[\s(])#([A-Za-z0-9_]+)/g, function (_, pre, tag) {

  function stripRtPrefix(text) {

  function isCeafeAuthor(author) {
    if (!author) return false;
    var handle = (author.username || "").replace(/^@/, "").toLowerCase();
    return handle === String(CONFIG.X_PROFILE || "F_CEAFE").toLowerCase() ||
      String(author.id || "") === "1178902181593964544";
  }

  function avatarHtml(author) {
    var url = author && (author.avatar || author.profile_image_url);
    if (!url && isCeafeAuthor(author) && CONFIG.LOGO_URL) url = CONFIG.LOGO_URL;
    if (url) {
      return '<img class="cmw-avatar" src="' + esc(url) + '" alt="">';
    }
    var initial = ((author && (author.username || author.name)) || "?").replace(/^@/, "");
    initial = initial ? initial.charAt(0) : "?";
    return '<div class="cmw-avatar cmw-avatar-ph" aria-hidden="true">' + esc(initial) + "</div>";
  }

  function authorLine(author) {
    var name = (author && (author.name || author.username)) || "CEAFE";
    var handle = author && author.username ? "@" + author.username : "";
    return '<div class="cmw-xname">' + esc(name) +
      (handle ? ' <span class="cmw-xhandle">' + esc(handle) + "</span>" : "") +
      "</div>";
  }

  function imagesHtml(images) {
    return (images || []).map(function (img) {
      var url = typeof img === "string" ? img : (img && img.url);
      if (!url) return "";
      var typ = (img && img.type) || "photo";
      var alt = typ === "video" || typ === "animated_gif" ? "Video" : "";
      return '<img class="cmw-ximage" src="' + esc(url) + '" alt="' + esc(alt) + '">';
    }).join("");
  }

  function localizedText(item) {
    if (!item) return "";
    if (state.uiLang === "en") return item.text_en || item.text || item.text_orig || "";
    return item.text_es || item.text || item.text_orig || "";
  }

  function langLabel(code) {
    var names = (I18N[state.uiLang] || I18N.es).langNames || {};
    return names[code] || code || "";
  }

  function translationNote(item) {
    if (!item) return "";
    var orig = (item.lang_orig || item.lang || "").toLowerCase();
    if (!orig || orig === "und" || orig === "zxx") return "";
    if (orig === state.uiLang) return "";
    var shown = localizedText(item);
    var source = item.text_orig || item.text || "";
    if (!shown || shown === source) return "";
    var href = item.url || "";
    var label = t("translatedFrom") + " " + langLabel(orig);
    var link = href
      ? ' · <a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(t("viewOriginal")) + "</a>"
      : "";
    return '<p class="cmw-xnote">' + esc(label) + link + "</p>";
  }

  function cardHtml(post) {
    var author = post.author || { username: CONFIG.X_PROFILE, name: "CEAFE" };
    var typ = post.type || "original";
    var ref = post.ref;
    var when = formatWhen(post.created_at, state.uiLang);
    var action = "";
    var bodyItem = post;
    var bodyImages = post.images;
    var quote = "";

    if (typ === "repost" && ref) {
      var who = (ref.author && ref.author.username) ? "@" + ref.author.username : (ref.author && ref.author.name) || "";
      action = '<p class="cmw-xaction">' + esc(t("reposted") + (who ? " " + who : "")) + "</p>";
      author = ref.author && (ref.author.username || ref.author.name) ? ref.author : author;
      bodyItem = ref;
      bodyImages = (ref.images && ref.images.length) ? ref.images : post.images;
    } else if (typ === "quote" && ref) {
      var qWho = (ref.author && ref.author.username) ? "@" + ref.author.username : "";
      action = qWho ? '<p class="cmw-xaction">' + esc(t("quoted") + " " + qWho) + "</p>" : "";
      quote = '<div class="cmw-quote">' +
        authorLine(ref.author || {}) +
        '<div class="cmw-xtext">' + linkify(localizedText(ref)) + "</div>" +
        imagesHtml(ref.images) +
        translationNote(ref) +
        "</div>";
    } else {
      bodyItem = post;
    }

    var href = post.url || (ref && ref.url) || ("https://x.com/" + CONFIG.X_PROFILE);
    return '<article class="cmw-xcard">' +
      action +
      '<div class="cmw-xmeta">' +
        avatarHtml(author) +
        "<div>" + authorLine(author) +
          (href
            ? ' <a class="cmw-xtime" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(when) + "</a>"
            : ' <span class="cmw-xtime">' + esc(when) + "</span>") +
        "</div>" +
      "</div>" +
      '<div class="cmw-xtext">' + linkify(localizedText(bodyItem)) + "</div>" +
      imagesHtml(bodyImages) +
      translationNote(bodyItem) +
      quote +
      "</article>";
  }

  function xwallUrlFromManifest(url) {
    if (CONFIG.XWALL_URL) return CONFIG.XWALL_URL;
    if (!url) return "";
    if (/xwall\.json(?:$|\?)/i.test(url)) return url;
    if (/manifest\.json(?:$|\?)/i.test(url)) return url.replace(/manifest\.json/i, "xwall.json");
    return url.replace(/\/?$/, "/") + "xwall.json";
  }

  function postsFromPayload(payload) {
    if (!payload) return [];
    if (Array.isArray(payload.posts) && payload.posts.length) return payload.posts;
    if (Array.isArray(payload.x_posts) && payload.x_posts.length) return payload.x_posts;
    return [];
  }

  function renderXWall(payload) {
    var node = $("[data-xwall]");
    if (!node) return;
    var posts = postsFromPayload(payload);
    if (!posts.length && state.xwall) posts = postsFromPayload(state.xwall);
    if (!posts.length && state.manifest) posts = postsFromPayload(state.manifest);
    if (!posts.length) {
      var href = CONFIG.X_PROFILE_URL || ("https://x.com/" + (CONFIG.X_PROFILE || "F_CEAFE"));
      node.innerHTML = '<div class="cmw-xwall cmw-xempty"><p class="cmw-muted">' + esc(t("xEmpty")) +
        ' <a href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">@' + esc(CONFIG.X_PROFILE || "F_CEAFE") + "</a>.</p>" +
        '<p><a class="cmw-xfollow" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(t("followX")) + "</a></p></div>";
      root.setAttribute("data-rendered-x", "empty");
      return;
    }
    node.innerHTML = '<div class="cmw-xwall" tabindex="0" aria-label="@' +
      esc(CONFIG.X_PROFILE) + '">' + posts.map(cardHtml).join("") + "</div>";
    root.setAttribute("data-rendered-x", "self");
  }

  function loadJson(url) {
    if (!url) return Promise.resolve(null);
    /* Cache-bust (per minute) so a stale manifest never hides a new upload. */
    var bust = url + (url.indexOf("?") < 0 ? "?" : "&") + "v=" + Math.floor(Date.now() / 60000);
    return fetch(bust, { credentials: "omit", mode: "cors", cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .catch(function () { return null; });
  }

  /* ---------- Boot ---------- */

  function bind() {
    $all("[data-set-lang]").forEach(function (btn) {
      btn.addEventListener("click", function () { setLang(btn.getAttribute("data-set-lang")); });
    });
    $all("[data-daystep]").forEach(function (btn) {
      btn.addEventListener("click", function () { stepDay(Number(btn.getAttribute("data-daystep"))); });
    });
  }

  function initWithManifest(manifest, xwall) {
    state.manifest = manifest || { videos: [], sections: {}, briefs: {}, x_posts: [], section_list: [], lists: [] };
    state.xwall = xwall || { posts: postsFromPayload(state.manifest) };
    state.dates = allDates();
    state.dayIndex = 0;
    setLang(state.uiLang, false);
    renderXWall(state.xwall);
    scheduleVideoReleaseRefresh();
  }

  function boot() {
    root = document.getElementById("ceafe-mw");
    if (!root || root.getAttribute("data-ready") === "1") return;
    root.setAttribute("data-ready", "1");
    state = { uiLang: preferredLang(), manifest: null, xwall: null, dates: [], dayIndex: 0 };
    applyLogo();
    bind();
    $("[data-cards]").innerHTML = '<p class="cmw-muted">' + esc(I18N[state.uiLang].loading) + "</p>";
    var url = CONFIG.MANIFEST_URL;
    if (!url || /YOUR-HOST/.test(url)) {
      renderFallbackVideo();
      $("[data-cards]").innerHTML = '<p class="cmw-muted">' + esc(I18N[state.uiLang].noManifest) + "</p>";
      loadJson(xwallUrlFromManifest(CONFIG.XWALL_URL || "")).then(function (xwall) {
        initWithManifest({ videos: [], sections: {}, x_posts: [] }, xwall);
      });
      return;
    }
    Promise.all([loadJson(url), loadJson(xwallUrlFromManifest(url))])
      .then(function (pair) {
        var manifest = pair[0];
        var xwall = pair[1];
        if (!manifest) throw new Error("no manifest");
        initWithManifest(manifest, xwall);
      })
      .catch(function () {
        root.setAttribute("data-fallback", "1");
        renderFallbackVideo();
        $("[data-cards]").innerHTML = '<p class="cmw-error">' + esc(I18N[state.uiLang].loadError) + "</p>";
        loadJson(xwallUrlFromManifest(url)).then(function (xwall) {
          initWithManifest({ videos: [], sections: {}, x_posts: [] }, xwall);
        });
      });
  }

  function start() {
    try { boot(); } catch (err) { console.log("CEAFE widget failed: " + (err && err.message)); }
  }

  if (window.dmAPI && typeof window.dmAPI.runOnReady === "function") {
    window.dmAPI.runOnReady("ceafe-widget", start);
  } else if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();
</script>
<!-- CEAFE WIDGET END -->

<script>(function(){if(new URLSearchParams(location.search).get("lang")){var t=document.querySelector("#ceafe-mw .cmw-top");if(t)t.style.display="none";}})();</script>
